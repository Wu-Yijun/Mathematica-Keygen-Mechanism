name: Build and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test the algorithm
        run: pnpm test

      # Builds src/index.ts -> dist/index.js and copies index.html, index.css,
      # logo.svg and favicon.ico into dist/ (see tsdown.config.ts).
      - name: Build
        run: pnpm build

      - name: Deploy
        uses: Wu-Yijun/actions/.github/actions/deploy@main
        with:
          path: dist/
