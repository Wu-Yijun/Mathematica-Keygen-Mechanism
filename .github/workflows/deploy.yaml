name: Build and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      #### Set up environment ####
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # with:
        #   version: 12 # Already in package.json engines field, so no need to specify here.

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test the algorithm
        run: pnpm test

      # Builds src/index.ts -> dist/index.js and copies index.html, index.css,
      # logo.svg and favicon.ico into dist/ (see tsdown.config.ts).
      - name: Build
        run: pnpm build

      - name: Deploy
        uses: Wu-Yijun/actions/.github/actions/deploy@main
        with:
          path: dist/
